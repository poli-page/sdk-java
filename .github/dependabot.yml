version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - java
    groups:
      test-dependencies:
        patterns:
          - "org.junit.*"
          - "org.assertj:*"
          - "org.wiremock:*"
        update-types:
          - minor
          - patch
      build-plugins:
        patterns:
          - "org.apache.maven.plugins:*"
          - "com.diffplug.spotless:*"
          - "org.jacoco:*"
          - "org.codehaus.mojo:*"
          - "com.github.siom79.japicmp:*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: Europe/Paris
    # Dependabot waits 3 days after a release by default; a new API contract
    # version comes the next day.
    cooldown:
      default-days: 3
      exclude:
        - "poli-page/api-contract"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    groups:
      # Each API contract version gets its own PR, whose CI shows what the
      # API change breaks.
      api-contract:
        patterns:
          - "poli-page/api-contract"
      actions:
        patterns:
          - "*"
        exclude-patterns:
          - "poli-page/api-contract"
        update-types:
          - minor
          - patch
