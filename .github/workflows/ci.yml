name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read
  # Required by codecov-action's use_oidc: true so it can mint a short-lived
  # OIDC token. Codecov rejects unauthenticated uploads on the default
  # (protected) branch, and we don't keep a CODECOV_TOKEN secret.
  id-token: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Java ${{ matrix.java }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # 26: the newest JDK, whose CompletableFuture wraps a cancellation in join()/get().
        java: ['17', '21', '25', '26']
        include:
          - os: windows-latest
            java: '21'
          - os: macos-latest
            java: '21'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # Spotless is a formatting check, not a per-JDK check — run once on the
      # Ubuntu+Java 21 slot. google-java-format requires JDK 21+ to run, and
      # newer JDKs change javac internals it depends on.
      - name: Spotless check
        if: matrix.os == 'ubuntu-latest' && matrix.java == '21'
        run: ./mvnw -B spotless:check

      - name: Compile
        run: ./mvnw -B compile

      # Copies the pinned contract.json to $RUNNER_TEMP. ContractTest reads it
      # from POLI_CONTRACT, and fails when CI is set and POLI_CONTRACT is not.
      - name: API contract
        id: contract
        uses: poli-page/api-contract@0eba96c1ecf9a28b7e259f444f3ca5b7c059d5fd # v1.3.0

      - name: Test + verify (with JaCoCo coverage gate)
        env:
          POLI_CONTRACT: ${{ steps.contract.outputs.path }}
        run: ./mvnw -B verify

      # JaCoCo XML lives at target/site/jacoco/jacoco.xml after `mvn verify`.
      # Only upload once (Ubuntu+Java 21). use_oidc: true is mandatory:
      # Codecov rejects tokenless uploads on the default (protected) branch,
      # and we've granted id-token: write at the workflow level. No
      # CODECOV_TOKEN secret needed. fail_ci_if_error stays false so a
      # Codecov outage or rate-limit never blocks the build.
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.java == '21'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: target/site/jacoco/jacoco.xml
          use_oidc: true
          fail_ci_if_error: false

      - name: Javadoc
        run: ./mvnw -B javadoc:javadoc

      # Same release-profile build as release.yml's verify job, so a doclint or
      # sources-jar break shows up on the PR instead of on the release tag.
      # Unsigned; japicmp is left to release.yml, which knows the baseline.
      - name: Release profile (unsigned sources + javadoc jars)
        if: matrix.os == 'ubuntu-latest' && matrix.java == '21'
        run: ./mvnw -B -P release -Dgpg.skip -Djapicmp.skip=true -DskipTests package

      - name: Install smoke
        if: matrix.os == 'ubuntu-latest'
        run: |
          ./mvnw -B -DskipTests install
          SDK_VERSION=$(./mvnw -q -Dexpression=project.version -DforceStdout help:evaluate)
          echo "Smoke-testing SDK ${SDK_VERSION} as a downstream Maven consumer"

          SMOKE_DIR="$(mktemp -d)"
          cd "$SMOKE_DIR"
          mkdir -p src/main/java/smoke

          cat > pom.xml <<POM
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0">
              <modelVersion>4.0.0</modelVersion>
              <groupId>page.poli.smoke</groupId>
              <artifactId>install-smoke</artifactId>
              <version>0</version>
              <properties>
                  <maven.compiler.release>17</maven.compiler.release>
                  <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
              </properties>
              <dependencies>
                  <dependency>
                      <groupId>page.poli</groupId>
                      <artifactId>sdk</artifactId>
                      <version>${SDK_VERSION}</version>
                  </dependency>
              </dependencies>
              <build>
                  <plugins>
                      <plugin>
                          <groupId>org.codehaus.mojo</groupId>
                          <artifactId>exec-maven-plugin</artifactId>
                          <version>3.3.0</version>
                      </plugin>
                  </plugins>
              </build>
          </project>
          POM

          cat > src/main/java/smoke/Main.java <<'JAVA'
          package smoke;

          public class Main {
              public static void main(String[] args) throws Exception {
                  // The SDK jar is on the classpath and its entry type resolves.
                  Class<?> clientClass = Class.forName("page.poli.sdk.PoliPageClient");
                  System.out.println("Install smoke OK: " + clientClass.getName());
              }
          }
          JAVA

          mvn -B -q compile
          mvn -B -q exec:java -Dexec.mainClass=smoke.Main

  # One check that sums up the PR jobs: the aggregate gate the branch ruleset requires for
  # merges.
  ci:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = success
