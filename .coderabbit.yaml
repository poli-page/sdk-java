# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit config for poli-page repos. PRs here are mostly opened and fixed by automated agents
# (the poli-page auto loop and issue pipeline), which read CodeRabbit's findings and its commit status.
language: en-US
early_access: false
reviews:
  profile: chill
  request_changes_workflow: false
  allow_author_approval: true
  # The summary goes in the walkthrough, never in the PR description: the merge gate reads the description.
  high_level_summary: false
  high_level_summary_in_walkthrough: true
  review_status: true
  review_details: false
  # The loop decides "reviewed this head" from the CodeRabbit commit status ("Review completed").
  review_progress: true
  commit_status: true
  fail_commit_status: false
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  # PR labels are the closed issues' labels; CodeRabbit only suggests.
  auto_apply_labels: false
  suggested_reviewers: true
  auto_assign_reviewers: false
  in_progress_fortune: false
  poem: false
  enable_prompt_for_ai_agents: true
  abort_on_close: true
  disable_cache: false
  slop_detection:
    enabled: true
    include_all_authors: false
  auto_review:
    enabled: true
    drafts: false
    # Every push of a fix round must be reviewed, and never auto-paused (the loop allows up to 5 rounds).
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
  pre_merge_checks:
    docstrings:
      mode: "off"
  path_filters:
    - "!**/target/**"
    - "!docs/package-lock.json"
    - "!docs/dist/**"
    - "!docs/.astro/**"
    - "!.mvn/wrapper/maven-wrapper.jar"
  path_instructions:
    - path: "src/main/java/page/poli/sdk/**"
      instructions: >-
        Public API surface of the Java SDK. It must stay consistent with the other poli-page SDKs
        and the API spec. No breaking changes to public classes or methods without a major
        version bump. Everything under internal/ is not public API. Keep module-info.java exports
        in sync.
    - path: "src/main/java/page/poli/sdk/exception/**"
      instructions: >-
        Errors must be built from the API error shape { error: { code } } and map to the
        matching PoliPage*Exception and PoliPageErrorCode. Never leak the API key in messages.
    - path: "src/main/java/page/poli/sdk/internal/**"
      instructions: >-
        Transport, retry, backoff and URL handling. Check retry only on retryable statuses and
        network errors, bounded backoff, safe idempotency handling, cancellation, and no secrets
        in logs or hook events.
    - path: "src/test/**"
      instructions: >-
        Every public method needs a unit test (the project is TDD). Tests must not hit the
        network; integration tests live in src/integrationTest and need POLI_PAGE_API_KEY.
    - path: "examples/**"
      instructions: >-
        Sample code customers copy. API keys come from environment variables, never hardcoded.
        Keep examples compiling against the current public API and matching the README.
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "CONTRIBUTING.md"
      - "sdk-engineering-guide.md"
